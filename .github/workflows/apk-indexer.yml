name: apk-indexer

# Tests the indexer on every PR and push that touches it. On main, and on tags named
# apk-indexer-vX.Y.Z, it also publishes the container image to GitHub Container Registry.
on:
  push:
    branches: [main]
    tags: ["apk-indexer-v*"]
    paths:
      - "apk-indexer/**"
      - ".github/workflows/apk-indexer.yml"
  pull_request:
    paths:
      - "apk-indexer/**"
      - ".github/workflows/apk-indexer.yml"

concurrency:
  group: apk-indexer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/the-gopher/androiddevversionupdater-apk-indexer

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk-indexer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apk-indexer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    # Writing a package needs packages: write, which a job-level block replaces the
    # top-level one to grant, so contents is spelled out again.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=apk-indexer-v(.*),group=1

      # Pull requests build the image to prove the Dockerfile works but never publish it,
      # and never log in, so a fork's PR cannot reach the registry.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apk-indexer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
